name: amusnaw
description: "Amusnaw — un prof IA pour apprendre le kabyle, sa culture et son histoire."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Icône de l'app : dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1D1B18"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-400.ttf
          weight: 400
        - asset: assets/fonts/Onest-500.ttf
          weight: 500
        - asset: assets/fonts/Onest-600.ttf
          weight: 600
        - asset: assets/fonts/Onest-700.ttf
          weight: 700
    - family: NotoSansTifinagh
      fonts:
        - asset: assets/fonts/NotoSansTifinagh-Regular.ttf
